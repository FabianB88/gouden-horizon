<!doctype html><meta charset="utf-8"><title>Forest paving review</title>
<style>body{margin:0}canvas{display:block}</style><canvas width="1536" height="1024"></canvas>
<script type="module">
import {AREA_BY_ID} from '../src/data.js';
import {floors,canStand} from '../src/engine.js';
const params=new URLSearchParams(location.search),tile=Number(params.get('tile')||0),overlay=params.has('overlay'),c=document.querySelector('canvas').getContext('2d'),a=AREA_BY_ID.forest;
const load=async file=>{const i=new Image();i.src='../assets/painted/'+file;await i.decode();return i;};
c.scale(1/1.75,1/1.75);c.translate(-tile*2688,0);
for(const t of a.tiles)c.drawImage(await load(t.file),t.x,t.y,t.width,t.height);
for(const j of a.joins)c.drawImage(await load('region-causeway-v882.webp'),j.x,j.y,j.width,j.height);
if(overlay){for(const poly of floors('forest')){c.beginPath();poly.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.fillStyle='#37cf9a22';c.fill();c.strokeStyle='#30fcca';c.lineWidth=1.75;c.stroke();}}
if(params.has('clearance'))for(let y=0;y<1024;y+=8)for(let x=0;x<1536;x+=8){c.fillStyle=canStand((tile*1536+x)*1.75,y*1.75,18,'forest')?'#00ff9933':'#ff005533';c.fillRect((tile*1536+x)*1.75,y*1.75,14,14);}
c.font='20px sans-serif';c.lineWidth=3;c.strokeStyle='black';c.fillStyle='white';
if(params.has('grid'))for(let y=50;y<1024;y+=100)for(let x=50;x<1536;x+=100){const label=x+','+y;c.strokeText(label,(tile*1536+x)*1.75,y*1.75);c.fillText(label,(tile*1536+x)*1.75,y*1.75);}
document.body.dataset.ready='true';
</script>
