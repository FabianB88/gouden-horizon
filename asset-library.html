<!doctype html>

<head>

<style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#102a2c;color:#f3e7ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#285047,#102a2c 65%);min-height:100vh}header,main{max-width:1180px;margin:auto;padding:28px}header{display:flex;align-items:flex-start;gap:20px;justify-content:space-between}h1{font-size:clamp(26px,5vw,42px);margin:7px 0 12px}p{line-height:1.6;max-width:780px;margin:8px 0;color:#d4decf}a{color:#e9c47d}header small{letter-spacing:.15em;color:#e9c47d}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:20px;background:#0c2326bb;border:1px solid #8c835c;border-radius:12px}label{display:flex;flex-direction:column;gap:8px;font:14px system-ui,sans-serif}input,select,button{font:inherit;background:#183936;color:#f3e7ca;border:1px solid #a1956c;border-radius:6px;padding:10px}input[type=search]{width:min(330px,76vw)}button{cursor:pointer}button:hover{background:#365447}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9c47d;outline-offset:3px}.check{flex-direction:row;align-items:center;padding-bottom:10px}.summary{font:14px system-ui,sans-serif;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(285px,100%),1fr));gap:20px}.card{background:#0e2629ee;border:1px solid #736f52;border-radius:12px;overflow:hidden}.card canvas{display:block;width:100%;aspect-ratio:460/310;background:radial-gradient(ellipse,#3c5746,#172d30)}.body{padding:18px}.body h2{margin:0 0 8px;font-size:24px}.badge{font:12px system-ui,sans-serif;display:inline-block;background:#29493e;color:#e4e7c1;padding:5px 8px;border-radius:4px}.meta{font:13px/1.6 system-ui,sans-serif;color:#cbd8cf;margin:12px 0}.card button{width:100%;font:14px system-ui,sans-serif}.card details{font:12px system-ui,sans-serif;margin-top:12px}.card pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;user-select:all}.empty{grid-column:1/-1;padding:30px;text-align:center}.status{min-height:24px;font:14px system-ui,sans-serif;color:#ead49c}footer{padding:28px;max-width:1180px;margin:auto;font:13px/1.6 system-ui,sans-serif;color:#cad5c8}footer a{margin-right:20px}@media(max-width:620px){header,main{padding:18px}header{flex-wrap:wrap}.tools{padding:14px}.grid{grid-template-columns:1fr}header select{max-width:150px}}
